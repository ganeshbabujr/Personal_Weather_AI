name: Storm Watch

on:
  schedule:
    - cron: "*/30 1-16 * * *"   # every 30 min, 6:30 AM - 10:00 PM IST
  workflow_dispatch:

jobs:
  watch:
    runs-on: ubuntu-latest
    env:
      OWM_API_KEY: ${{ secrets.OWM_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      ZIP_CODE: ${{ vars.ZIP_CODE }}
      WIND_LIMIT: ${{ vars.WIND_LIMIT }}
      BRIEF_LANG: ${{ vars.BRIEF_LANG }}
      BIG_TEXT: ${{ vars.BIG_TEXT }}
    steps:
      - uses: actions/checkout@v4
      # Remembers which alerts were already sent, so the family never gets the same alert twice.
      - name: Restore alert memory
        uses: actions/cache@v4
        with:
          path: alert_state.json
          key: alerts-${{ github.run_id }}
          restore-keys: alerts-
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-color-emoji fonts-noto-core
      - run: pip install requests playwright
      - run: playwright install --with-deps chromium
      - run: python weather.py --watch
      - name: Tell me if the run failed
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode text="⚠️ Weather bot failed: ${{ github.workflow }}. Details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
