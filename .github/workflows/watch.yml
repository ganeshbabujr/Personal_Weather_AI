name: Storm Watch

on:
  schedule:
    - cron: "*/30 1-16 * * *"
  workflow_dispatch:

jobs:
  watch:
    runs-on: ubuntu-latest
    env:
      OWM_API_KEY: ${{ secrets.OWM_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GOLD_API_KEY: ${{ secrets.GOLD_API_KEY }}
      ZIP_CODE: ${{ vars.ZIP_CODE }}
      WIND_LIMIT: ${{ vars.WIND_LIMIT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-color-emoji fonts-noto-core
      - run: pip install requests pyyaml holidays ephem playwright
      - run: playwright install --with-deps chromium
      - run: python weather.py --watch
