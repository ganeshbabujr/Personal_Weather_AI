name: Daily Family Briefing

on:
  schedule:
    - cron: "7 0 * * *"         # starts 5:37 AM IST on purpose; the script then waits until SEND_AT
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    env:
      OWM_API_KEY: ${{ secrets.OWM_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GOLD_API_KEY: ${{ secrets.GOLD_API_KEY }}
      ZIP_CODE: ${{ vars.ZIP_CODE }}
      SHEET_CSV_URL: ${{ vars.SHEET_CSV_URL }}
      HOLIDAY_STATE: ${{ vars.HOLIDAY_STATE }}
      EXTRA_ZIPS: ${{ vars.EXTRA_ZIPS }}
      SCHOOL_DROP: ${{ vars.SCHOOL_DROP }}
      SCHOOL_PICKUP: ${{ vars.SCHOOL_PICKUP }}
      SCHOOL_OFF: ${{ vars.SCHOOL_OFF }}
      WATCH: ${{ vars.WATCH }}
      WIND_LIMIT: ${{ vars.WIND_LIMIT }}
      BRIEF_LANG: ${{ vars.BRIEF_LANG }}
      BIG_TEXT: ${{ vars.BIG_TEXT }}
      SEND_AT: ${{ vars.SEND_AT || '06:00' }}
      SEND_TZ: ${{ vars.SEND_TZ || 'Asia/Kolkata' }}
    steps:
      - uses: actions/checkout@v4
      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
      - name: Cache metal rates
        uses: actions/cache@v4
        with:
          path: metals.json
          key: metals-${{ steps.date.outputs.date }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-color-emoji fonts-noto-core
      - run: pip install requests pyyaml holidays playwright ephem
      - run: playwright install --with-deps chromium
      - run: python weather.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cards
          path: |
            *.png
          retention-days: 3
          if-no-files-found: ignore
      - name: Tell me if the run failed
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode text="⚠️ Weather bot failed: ${{ github.workflow }}. Details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
