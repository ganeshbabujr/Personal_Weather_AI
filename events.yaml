# Family events. Keep dates in quotes. No phone numbers needed.
#
# One-time or yearly:
#   date: "MM-DD"       repeats every year (birthdays, anniversaries)
#   date: "YYYY-MM-DD"  happens once
#   year: 1966          optional, shows the age or number of years
# Repeating reminders (shown on the day, not in "Coming up"):
#   repeat: daily
#   repeat: weekly, days: [Mon, Thu]
#   repeat: monthly, day: 5
# type: birthday | anniversary | event | reminder | bill | medicine | pet | vehicle | exam

